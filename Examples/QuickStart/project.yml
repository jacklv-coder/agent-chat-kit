name: AgentChatQuickStart
options:
  bundleIdPrefix: com.jacklvcoder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  AgentChatKit:
    path: ../..

targets:
  AgentChatQuickStart:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: AgentChatKit
        product: AgentChatKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklvcoder.AgentChatQuickStart
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentChatQuickStart
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
