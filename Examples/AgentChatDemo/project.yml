name: AgentChatDemo
options:
  bundleIdPrefix: com.jacklvcoder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  AgentChatKit:
    path: ../..

targets:
  AgentChatDemo:
    type: application
    platform: iOS
    sources:
      - App
      - Scenarios
      - CustomRenderers
    dependencies:
      - package: AgentChatKit
        product: AgentChatKit
      - package: AgentChatKit
        product: AgentChatTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklvcoder.AgentChatDemo
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentChatDemo
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - AgentChatDemoUITests

  AgentChatDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: AgentChatDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacklvcoder.AgentChatDemoUITests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentChatDemo
